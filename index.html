<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Portafolio Futurista</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            --black: #010101;
            --primary: #9945FF;
            --secondary: #14f195;
            --terciary: #13f2e3;
            --light: #13f2e3;
        }

        body {
            background-color: var(--black);
            color: white;
            font-family: 'Share Tech Mono', monospace;
            overflow-x: hidden;
        }

        h1, h2, h3, h4, h5, h6 {
            font-family: 'Orbitron', sans-serif;
        }

        .gradient-border {
            position: relative;
            padding: 4px;
            border-radius: 9999px;
            overflow: hidden;
            background: linear-gradient(45deg, var(--primary), var(--secondary));
        }

        .animated-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            overflow: hidden;
            z-index: -1;
        }
        .animated-bg div {
            position: absolute;
            border-radius: 50%;
            filter: blur(100px);
            opacity: 0.5;
        }
        .bg-orb-1 {
            width: 500px;
            height: 500px;
            background: var(--primary);
            animation: move-orb-1 20s alternate infinite;
        }
        .bg-orb-2 {
            width: 400px;
            height: 400px;
            background: var(--secondary);
            animation: move-orb-2 25s alternate-reverse infinite;
        }
        .bg-orb-3 {
            width: 350px;
            height: 350px;
            background: var(--terciary);
            animation: move-orb-3 18s alternate infinite;
        }
        .bg-orb-4 {
            width: 300px;
            height: 300px;
            background: var(--primary);
            animation: move-orb-4 22s alternate-reverse infinite;
        }

        @keyframes move-orb-1 {
            from { top: 10%; left: -20%; }
            to { top: 70%; left: 40%; }
        }
        @keyframes move-orb-2 {
            from { top: 80%; left: 10%; }
            to { top: 10%; left: 80%; }
        }
        @keyframes move-orb-3 {
            from { top: 50%; left: 90%; }
            to { top: 20%; left: 20%; }
        }
        @keyframes move-orb-4 {
            from { top: -10%; left: 60%; }
            to { top: 90%; left: 90%; }
        }

    </style>
<script type="importmap">
{
  "imports": {

    "tsparticles-slim": "https://aistudiocdn.com/tsparticles-slim@^2.12.0",

  }
}
</script>
</head>

</body>
</html>
